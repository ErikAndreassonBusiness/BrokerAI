name: Tests

# Lint, tests and data validation. Runs on every pull request to main, before pages.yml publishes the
# site, and on the report agent's branch: GitHub doesn't run workflows for the bot's own pull requests,
# so reports.yml starts this one itself.
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Tests
        run: uv run pytest

      - name: Validate data
        run: uv run python -m app.backend.validate
